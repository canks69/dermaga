# Groups the auto-generated release notes. `gh release create --generate-notes`
# reads this, so what ships in a release reads as features and fixes rather
# than as a list of commit subjects.
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Bug fixes
      labels:
        - bug
        - fix
    - title: Performance
      labels:
        - performance
    - title: Documentation
      labels:
        - documentation
    - title: Maintenance
      labels:
        - chore
        - dependencies
        - refactor
    - title: Other changes
      labels:
        - "*"
